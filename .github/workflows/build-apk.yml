name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup template Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; else mkdir -v -p ~/.config/godot; fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Konfigurasi Android (keystore dan path SDK)
        run: |
          JAVA_DIR="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "JAVA: $JAVA_DIR"
          echo "SDK: $SDK_DIR"
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          cat > ~/.config/godot/editor_settings-4.4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.4.tres ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Build APK
        run: |
          mkdir -v -p build/android
          set +e
          godot --headless --verbose --export-debug "Android Debug" build/android/NeonTrace-debug.apk > build.log 2>&1
          STATUS=$?
          echo "===== RINGKASAN ERROR ====="
          grep -n -A4 "ERROR:" build.log | tail -40
          echo "===== SELESAI, kode keluar: $STATUS ====="
          exit $STATUS

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonTrace-debug-apk
          path: build/android
          
